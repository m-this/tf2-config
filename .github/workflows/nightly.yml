name: Nightly

on:
  workflow_dispatch:
  push:
    branches: [main]
  # budhud and mastercomfig move without this repo moving, and nightly is
  # where their latest state shows up.
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: nightly
  cancel-in-progress: true

# `nightly` is a tag on the head of main with a prerelease carrying budhud
# master and the latest mastercomfig. A real release takes the pins in
# versions.env instead.
jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: build the files
        run: |
          make dist VERSION=nightly BUILD_CHANNEL=nightly \
            ZIP_URL="https://github.com/${{ github.repository }}/releases/download/nightly/budhud.zip" \
            | tail -1 > /tmp/summary.txt
          cat /tmp/summary.txt

      - name: write the notes
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            printf '**This is not a release.** It is budhud master and the latest mastercomfig,\n'
            printf 'rebuilt every day and on every push, and it is replaced without warning. For\n'
            printf 'something that stays put, use the [latest release](https://github.com/%s/releases/latest).\n\n' "${{ github.repository }}"
            printf '%s, built from `%s`.\n\n' "$(cat /tmp/summary.txt)" "$GITHUB_SHA"
            printf 'Download [budhud.bat](https://github.com/%s/releases/download/nightly/budhud.bat) and run it.\n\n' "${{ github.repository }}"
            if [ -n "$last" ]; then
              printf '## Since %s\n\n' "$last"
              git log --no-merges --pretty='- %s' "$last..HEAD"
            fi
          } > /tmp/nightly-notes.md

      - name: checksum the assets
        run: cd dist && sha256sum budhud.zip budhud.bat > SHA256SUMS && cat SHA256SUMS

      # Deleted and made again rather than force-moved: a force-update of a
      # protected tag is refused. Keep immutable releases off, or scoped to v*.
      - name: replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/nightly" 2>/dev/null || true
          git tag -d nightly 2>/dev/null || true
          git tag nightly "$GITHUB_SHA"
          git push origin "refs/tags/nightly"
          gh release create nightly \
            --verify-tag \
            --prerelease \
            --title "nightly" \
            --notes-file /tmp/nightly-notes.md \
            dist/budhud.zip dist/budhud.bat dist/SHA256SUMS
